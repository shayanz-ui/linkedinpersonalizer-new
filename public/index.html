<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LinkedIn Outreach Copywriter</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="wrap">
      <header>
        <h1>LinkedIn Outreach Copywriter</h1>
        <p class="sub">
          Paste a founder's LinkedIn profile — get two first-touch message options
          that spark curiosity without selling.
        </p>
      </header>

      <label class="field-label" for="profile">LinkedIn profile</label>
      <textarea
        id="profile"
        placeholder="Paste the profile here — bio, headline, recent posts, company info, anything visible…"
        rows="12"
      ></textarea>

      <button id="generate">Generate 2 options</button>

      <p id="read" class="read" hidden></p>
      <div id="results" class="results"></div>
      <p id="error" class="error" hidden></p>
    </main>
    <script src="/app.js"></script>
  </body>
</html>

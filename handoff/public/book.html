<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Book Your Demo</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
<main>
  <div id="loading" class="muted">Loading available times…</div>
  <div id="fatal" class="card hidden"></div>

  <section id="picker" class="hidden">
    <h1 id="title"></h1>
    <p class="sub" id="subtitle"></p>
    <div class="card">
      <div class="tz">Times shown in <select id="tz" aria-label="Timezone"></select></div>
      <div class="days" id="days" role="group" aria-label="Day"></div>
      <div class="times" id="times" role="group" aria-label="Time"></div>
    </div>

    <form id="confirm" class="card hidden">
      <h2 id="chosen"></h2>
      <div class="field">
        <label for="name">Your name</label>
        <input id="name" autocomplete="name" required />
      </div>
      <p class="muted" id="inviteTo"></p>
      <details>
        <summary>Add teammates to the invite</summary>
        <div class="field"><input id="guests" placeholder="cofounder@acme.com, cfo@acme.com" /></div>
      </details>
      <button id="bookBtn" type="submit">Confirm</button>
      <div id="error" class="error"></div>
    </form>
  </section>

  <section id="done" class="hidden">
    <h1>You're booked</h1>
    <p class="sub" id="doneText"></p>
    <div class="card">
      <div id="doneWhen" style="font-weight:600"></div>
      <div class="people" id="donePeople"></div>
      <p class="muted" id="doneLink"></p>
    </div>
  </section>
</main>
<script src="/assets/book.js"></script>
</body>
</html>
